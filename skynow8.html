<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" id="status-bar-color" content="#a8a29e">
    
    <title>SkyNow™ 6.0</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon-SN.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32x32-SN.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicon-16x16-SN.png">

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.0);
        --glass-border: rgba(255, 255, 255, 0.25);
        --accent-color: #a7f3d0; 
        --bg-fallback: #1e293b; 
        --hi-color: #fcbcc2; 
        --lo-color: #b4deff;
        --text-main: #ffffff;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: var(--bg-fallback);
        height: 100vh;
        height: -webkit-fill-available;
        overflow-x: hidden;
    }

    html {
        background-attachment: fixed;
        transition: none;
    }

    body {
        font-family: 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        color: var(--text-main);
        color-scheme: dark; 
        background: transparent !important;
    }

    /* THEME ENGINE */
    html.day-clear { background: linear-gradient(to bottom, #e67e22 0%, #a34f06 100%) no-repeat fixed; background-color: #a34f06; }
    html.day-cloudy { background: linear-gradient(to bottom, #778ba7 0%, #475569 100%) no-repeat fixed; background-color: #475569; }
    html.day-haze { background: linear-gradient(to bottom, #a8a29e 0%, #d1ccc0 50%, #78716c 100%) no-repeat fixed; background-color: #78716c; }
    html.day-mist { background: linear-gradient(to bottom, #94a3b8 0%, #94a3b8 50%, #64748b 100%) no-repeat fixed; background-color: #64748b; }
    html.day-rainy { background: linear-gradient(to bottom, #64748b 0%, #1e293b 100%) no-repeat fixed; background-color: #1e293b; }
    
    html.day-snowy { 
        background: linear-gradient(to bottom, #f8fafc 0%, #cbd5e1 100%) no-repeat fixed; 
        background-color: #cbd5e1; 
        --text-main: #1e293b; 
        --hi-color: #b91c1c; 
        --lo-color: #1d4ed8; 
        --glass-bg: rgba(0, 0, 0, 0.05);
        --glass-border: rgba(0, 0, 0, 0.05);
    }

    html.sunset { background: linear-gradient(to bottom, #ee5d6c, #fb9062 30%, #FFA500 100%) no-repeat fixed; background-color: #FFA500; }
    
    html.night, html.night-rain, html.night-snow, html.night-storm { 
        --hi-color: #ff4d6d; 
        --lo-color: #00d2ff; 
    }
    
    html.night { background: linear-gradient(to bottom, #1e293b 0%, #020617 100%) no-repeat fixed; background-color: #020617; }
    html.night-rain { background: linear-gradient(to bottom, #2c3e50 0%, #000000 100%) no-repeat fixed; background-color: #000000; }
    html.night-snow { background: linear-gradient(to bottom, #3657b1 0%, #1e293b 100%) no-repeat fixed; background-color: #1e293b; }
    html.night-storm { background: linear-gradient(to bottom, #1a1a2e 0%, #0f0f1a 100%, #4b0082 100%) no-repeat fixed; background-color: #4b0082; }

    /* LAYOUT & COMPONENTS */
    .app-container { 
        width: 88%; 
        max-width: 360px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        text-align: center; 
        gap: 8px; 
        padding-top: calc(env(safe-area-inset-top) + 12px); 
        padding-bottom: calc(env(safe-area-inset-bottom) + 15px);
    }
    
    #location { font-size: clamp(24px, 8vw, 38px); margin: 0; text-transform: uppercase; font-weight: 900; letter-spacing: -1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    #live-time { font-size: 15px; font-weight: 700; opacity: 0.8; text-transform: uppercase; margin-top: -4px; margin-bottom: 2px; }
    
    /* 3D FLIP CONTAINER ENGINE */
    .weather-card { 
        width: 100%; 
        perspective: 1000px; 
        margin-top: 5px; 
        position: relative;
    }
    
    .card-inner {
        width: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .weather-card.is-flipped .card-inner {
        transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
        width: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background: var(--glass-bg);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid var(--glass-border);
        border-radius: 40px;
        padding: 22px 15px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        box-sizing: border-box;
    }
    
    .card-back {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transform: rotateY(180deg);
    }

    /* CONTROL BAR CONTAINER */
    .toggle-container {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 1px;
        margin-bottom: 2px;
        z-index: 5;
        gap: 1px;
    }
    .toggle-btn {
        background: transparent; border: none;
        color: var(--text-main); font-size: 9.5px; font-weight: 800;
        padding: 4px 12px; border-radius: 15px; cursor: pointer;
        text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .toggle-btn.active {
        background: rgba(255, 255, 255, 0.2);
    }
    .toggle-btn.searching { 
        color: #059669; 
        background: rgba(52, 211, 153, 0.25); 
    }

    /* ADAPTIVE MACRO FORECAST */
    .forecast-headline { font-size: 13px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin: 4px 0 2px 0; opacity: 0.7; }
    
    .forecast-avg-block {
        display: flex; justify-content: center; align-items: center; gap: 8px;
        font-size: 72px; font-weight: 900; letter-spacing: -3px;
        margin-bottom: -2px; margin-top: -2px; line-height: 1;
    }
    .forecast-avg-block .avg-hi { color: var(--hi-color); }
    .forecast-avg-block .avg-lo { color: var(--lo-color); }
    .forecast-avg-block .divider { opacity: 0.3; font-weight: 400; font-size: 56px; margin: 0 2px; }
    .forecast-avg-label { font-size: 9px; font-weight: 900; opacity: 0.5; text-transform: uppercase; margin-top: 0px; margin-bottom: 4px; letter-spacing: 0.5px;}

    /* Distributes panels visually up to the exact height thresholds */
    .forecast-list { 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
        flex-grow: 1; 
        margin-top: 6px;
        margin-bottom: 4px;
    }
    .forecast-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 18px; background: rgba(255, 255, 255, 0.06);
        border-radius: 22px; border: 1px solid var(--glass-border);
    }
    .forecast-day { font-size: 16px; font-weight: 800; text-transform: uppercase; text-align: left; width: 38%; }
    .forecast-icon-wrap { width: 24%; text-align: center; font-size: 21px; }
    .forecast-temps { font-size: 18px; font-weight: 800; text-align: right; width: 38%; letter-spacing: -0.5px; }
    .forecast-temps .f-hi { color: var(--hi-color); }
    .forecast-temps .f-lo { color: var(--lo-color); }
    
    /* CURRENT WEATHER GLYPHS */
    #glyph { font-size: 80px; margin-bottom: 2px; }
    .temp-main { font-size: 95px; font-weight: 900; letter-spacing: -1px; margin: 0; line-height: 0.85; font-variant-numeric: tabular-nums; }
    #impact-label { font-size: 10px; font-weight: 900; opacity: 0.6; text-transform: uppercase; margin-top: 6px; height: 12px; letter-spacing: 0.5px; }
    
    .hi-lo-stack { font-size: 18px; font-weight: 800; display: flex; justify-content: center; gap: 15px; margin: 10px 0; }
    .hi-lo-stack .hi { color: var(--hi-color); } 
    .hi-lo-stack .lo { color: var(--lo-color); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
    .stat-box { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.1s ease; -webkit-tap-highlight-color: transparent; }
    .stat-box:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.96); }
    
    .stat-value { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
    .stat-label { font-size: 8.5px; font-weight: 900; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.5px; }
    
    #tooltip { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #170061; color: white; padding: 10px 15px; border-radius: 15px; font-size: 12px; font-weight: 600; width: 80%; display: none; z-index: 10; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    
    /* FAINTER TRENDING BOTTOM TICKER */
    .footer { font-size: 11px; font-weight: 800; margin-top: 10px; letter-spacing: 1px; transition: all 0.5s ease; color: #94a3b8; opacity: 0.65; }
</style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1 id="location">LOADING</h1>
            <div id="live-time">---</div>
        </header>

        <div class="toggle-container">
            <button class="toggle-btn active" id="view-now" onclick="setView(false)">Now</button>
            <button class="toggle-btn" id="view-5day" onclick="setView(true)">5-Day</button>
            <button class="toggle-btn" id="gps-btn" onclick="getPreciseLocation()">GPS</button>
        </div>
        
        <div class="weather-card" id="main-card">
            <div class="card-inner">
                
                <div class="card-front">
                    <div id="glyph"></div>
                    <h2 class="temp-main"><span id="temp-num">--</span>&deg;</h2>
                    <div id="impact-label">FEELS LIKE TEMPERATURE</div>
                    <div class="hi-lo-stack">
                        <span class="hi">High: <span id="hi-val">--</span>&deg;</span>
                        <span class="lo">Low: <span id="lo-val">--</span>&deg;</span>
                    </div>
                    <div class="description-group">
                        <p id="persona-desc" style="font-size: 18px; font-weight: 800; text-transform: uppercase; margin:0;">---</p>
                        <p id="api-desc" style="font-size: 11px; font-weight: 600; opacity: 0.5; text-transform: uppercase; margin-top: 2px;">---</p>
                    </div>
                    <div class="stats-grid" id="stats-container"></div>
                    <div id="tooltip"></div>
                </div>

                <div class="card-back">
                    <div>
                        <div class="forecast-headline">5-Day Forecast</div>
                        <div class="forecast-avg-block">
                            <span class="avg-hi"><span id="avg-hi-display">--</span>&deg;</span>
                            <span class="divider">/</span>
                            <span class="avg-lo"><span id="avg-lo-display">--</span>&deg;</span>
                        </div>
                        <div class="forecast-avg-label">Estimated 5-Day Average</div>
                    </div>

                    <div class="forecast-list" id="forecast-container">
                        </div>
                </div>

            </div>
        </div>
        
        <footer class="footer">SkyNow™ 6.0</footer>
    </div>

    <script>
        const key = 'd0704da8612745131eda6e9b3ce8ebb5';

        const tooltipData = {
            "ACTUAL TEMP": "The true air temperature without weather factors.",
            "HUMIDITY": "The percentage of water vapor in the air.",
            "WIND SPEED": "How fast the air is moving at ground level.",
            "UV INDEX": "Sun intensity; protect your skin accordingly.",
            "VISIBILITY": "Maximum distance clear objects are visible.",
            "SUNSET": "Approximate time the sun dips below the horizon.",
            "SUNRISES": "The time the sun will first appear in the morning."
        };

        function setView(showForecast) {
            const card = document.getElementById('main-card');
            const btnNow = document.getElementById('view-now');
            const btn5day = document.getElementById('view-5day');
            
            if (showForecast) {
                card.classList.add('is-flipped');
                btn5day.classList.add('active');
                btnNow.classList.remove('active');
            } else {
                card.classList.remove('is-flipped');
                btnNow.classList.add('active');
                btn5day.classList.remove('active');
            }
        }

        function showTooltip(label) {
            const tip = document.getElementById('tooltip');
            tip.innerText = tooltipData[label] || "";
            tip.style.display = 'block';
            setTimeout(() => { tip.style.display = 'none'; }, 3000);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 2); 
                const current = Math.floor(easeOut * (end - start) + start);
                obj.innerHTML = current;
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        async function checkForecast(lat, lon) {
            try {
                const resp = await fetch(`https://api.openweathermap.org/data/2.5/forecast?units=imperial&lat=${lat}&lon=${lon}&appid=${key}`);
                const data = await resp.json();
                
                const nowTemp = Math.round(data.list[0].main.temp);
                const sixHourForecast = data.list[2]; 
                const futureTemp = Math.round(sixHourForecast.main.temp);
                const futureWeather = sixHourForecast.weather[0].main.toLowerCase();
                const currentMainWeather = data.list[0].weather[0].main.toLowerCase();

                const footer = document.querySelector('.footer');
                let alertText = "SkyNow™ 6.0"; 

                if (futureWeather !== currentMainWeather) {
                    if (futureWeather.includes('rain')) alertText = "☔ RAIN EXPECTED WITHIN THE NEXT 6 HOURS.";
                    else if (futureWeather.includes('snow')) alertText = "❄️ BUNDLE UP, SNOW IS ON THE WAY!";
                    else if (futureWeather.includes('cloud')) alertText = "⛅️ CLOUDS ARE ROLLING IN SHORTLY.";
                } 
                else if (futureTemp <= nowTemp - 4) alertText = `🔽 TEMPERATURE DROPPING TO ${futureTemp}° SOON.`;
                else if (futureTemp >= nowTemp + 4) alertText = `🔥 TEMPERATURE WARMING UP TO ${futureTemp}° SHORTLY.`;

                footer.innerHTML = alertText;
                
                if (alertText !== "SkyNow™ 6.0") {
                    footer.style.color = "var(--accent-color)";
                    footer.style.opacity = "0.85";
                } else {
                    footer.style.color = "#94a3b8";
                    footer.style.opacity = "0.65";
                }

                processDailyForecasts(data.list);

            } catch(e) { console.log("Forecast error", e); }
        }

        function processDailyForecasts(list) {
            const container = document.getElementById('forecast-container');
            const currentDayStr = new Date().toLocaleDateString('en-US', { weekday: 'short' });
            
            let dailyData = {};

            list.forEach(chunk => {
                const date = new Date(chunk.dt * 1000);
                const dayShort = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayLong = date.toLocaleDateString('en-US', { weekday: 'long' });

                if (dayShort === currentDayStr) return;

                if (!dailyData[dayShort]) {
                    dailyData[dayShort] = {
                        name: dayLong,
                        temps: [],
                        weatherDescriptions: []
                    };
                }
                dailyData[dayShort].temps.push(chunk.main.temp);
                dailyData[dayShort].weatherDescriptions.push(chunk.weather[0].description.toLowerCase());
            });

            let htmlStr = '';
            let totalHi = 0;
            let totalLo = 0;
            let daysCounted = 0;

            for (let dayShort in dailyData) {
                if (daysCounted >= 5) break;

                const dayObj = dailyData[dayShort];
                const trueMax = Math.round(Math.max(...dayObj.temps));
                const trueMin = Math.round(Math.min(...dayObj.temps));
                
                totalHi += trueMax;
                totalLo += trueMin;
                daysCounted++;

                const primaryWeather = dayObj.weatherDescriptions[Math.floor(dayObj.weatherDescriptions.length / 2)];

                let icon = 'fa-sun';
                if (primaryWeather.includes('storm')) icon = 'fa-poo-storm';
                else if (primaryWeather.includes('snow')) icon = 'fa-snowflake';
                else if (primaryWeather.includes('rain') || primaryWeather.includes('drizzle')) icon = 'fa-cloud-showers-heavy';
                else if (primaryWeather.includes('cloud')) icon = 'fa-cloud-sun';
                else if (primaryWeather.includes('haze') || primaryWeather.includes('smoke') || primaryWeather.includes('mist') || primaryWeather.includes('fog')) icon = 'fa-smog';

                htmlStr += `
                    <div class="forecast-row">
                        <span class="forecast-day">${dayObj.name}</span>
                        <span class="forecast-icon-wrap"><i class="fas ${icon}"></i></span>
                        <span class="forecast-temps"><span class="f-hi">${trueMax}°</span> / <span class="f-lo">${trueMin}°</span></span>
                    </div>
                `;
            }
            container.innerHTML = htmlStr;

            if (daysCounted > 0) {
                const avgHi = Math.round(totalHi / daysCounted);
                const avgLo = Math.round(totalLo / daysCounted);
                animateValue("avg-hi-display", 0, avgHi, 800);
                animateValue("avg-lo-display", 0, avgLo, 800);
            }
        }

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('live-time').innerHTML = now.toLocaleDateString('en-US', options) + " • " + 
                now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function getPreciseLocation() {
            const btn = document.getElementById('gps-btn');
            if (btn) btn.classList.add('searching');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    localStorage.setItem('sn_lat', pos.coords.latitude);
                    localStorage.setItem('sn_lon', pos.coords.longitude);
                    weatherBallon(pos.coords.latitude, pos.coords.longitude);
                    setTimeout(() => { if (btn) btn.classList.remove('searching'); }, 1200);
                }, (err) => { 
                    if (btn) btn.classList.remove('searching'); 
                }, { enableHighAccuracy: true });
            }
        }

        function weatherBallon(lat, lon) {
            fetch(`https://api.openweathermap.org/data/2.5/weather?units=imperial&lat=${lat}&lon=${lon}&appid=${key}`)
                .then(resp => resp.json()).then(data => {
                    drawWeather(data);
                    checkForecast(lat, lon);
                });
        }

        function drawWeather(d) {
            const raw = d.weather[0].description.toLowerCase();
            const now = d.dt;
            const isNight = now > d.sys.sunset || now < d.sys.sunrise;
            const isGoldenHour = (now > d.sys.sunset - 3600 && now <= d.sys.sunset) || (now < d.sys.sunrise + 3600 && now >= d.sys.sunrise);

            const uvValue = d.uvi || 0; 
            let uvLabel = "LOW";
            if (uvValue >= 3 && uvValue < 6) uvLabel = "MODERATE";
            else if (uvValue >= 6 && uvValue < 8) uvLabel = "HIGH";
            else if (uvValue >= 8 && uvValue < 11) uvLabel = "VERY HIGH";
            else if (uvValue >= 11) uvLabel = "EXTREME";
            if (isNight) uvLabel = "NONE";

            const descriptiveMap = {
                'clear sky': isNight ? 'Starlit & Still' : 'Sunny and beautiful',
                'few clouds': isNight ? 'Moonlight Peeking' : 'A Few Drifting Clouds',
                'scattered clouds': isNight ? 'Cloudy Lunar Glow' : 'Sun Peeking Through Clouds',
                'broken clouds': 'Mostly Cloudy Canopy',
                'overcast clouds': 'Solid Gray Overcast',
                'light rain': 'Soft, Gentle Mist',
                'moderate rain': 'Steady Refreshing Rainfall',
                'heavy intensity rain': 'A Heavy Downpour',
                'snow': 'Whirling Winter Snowflakes',
                'thunderstorm': 'Electric & Stormy Skies',
                'mist': 'Hazy & Misty',
                'haze': 'Hazy Atmospheric Glow',
                'smoke': 'Smoky Haze'
            };

            document.getElementById('location').innerHTML = d.name;
            document.getElementById('persona-desc').innerHTML = descriptiveMap[raw] || raw;
            document.getElementById('api-desc').innerHTML = `${raw}`;
            document.getElementById('hi-val').innerHTML = Math.round(d.main.temp_max);
            document.getElementById('lo-val').innerHTML = Math.round(d.main.temp_min);

            const feels = Math.round(d.main.feels_like);
            const actual = Math.round(d.main.temp);
            const impactEl = document.getElementById('impact-label');
            
            if (feels > actual + 3) impactEl.innerText = "High Humidity Is Warming Temperature";
            else if (feels < actual - 3) impactEl.innerText = "Wind Chill Is Cooling Temperature";
            else impactEl.innerText = "THE CURRENT 'FEELS LIKE' TEMPERATURE";

            animateValue("temp-num", 0, feels, 1200);

            let sunLabel, sunValue, sunIcon;
            if (isNight) {
                sunLabel = 'SUNRISE';
                sunIcon = 'fa-sun';
                const targetSunrise = now > d.sys.sunset ? d.sys.sunrise + 86400 : d.sys.sunrise;
                sunValue = new Date(targetSunrise * 1000).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
            } else {
                sunLabel = 'SUNSET';
                sunIcon = 'fa-moon';
                sunValue = new Date(d.sys.sunset * 1000).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
            }

            const stats = [
                { icon: 'fa-thermometer-half', val: actual + '&deg;', label: 'ACTUAL TEMP', color: '#e640dd' },
                { icon: 'fa-tint', val: d.main.humidity + '%', label: 'HUMIDITY', color: '#00d2ff' },
                { icon: 'fa-wind', val: Math.round(d.wind.speed) + ' mph', label: 'WIND SPEED' , color: '#34e89e' },
                { icon: 'fa-sun', val: uvLabel, label: 'UV INDEX', color: '#fbbf24' },
                { icon: 'fa-eye', val: (d.visibility / 1609).toFixed(1) + ' miles', label: 'VISIBILITY', color: '#a29bfe' },
                { icon: sunIcon, val: sunValue, label: sunLabel, color: '#fbbf24' }
            ];

            document.getElementById('stats-container').innerHTML = stats.map(s => `
                <div class="stat-box" onclick="showTooltip('${s.label}')">
                    <i class="fas ${s.icon}" style="color:${s.color}"></i>
                    <span class="stat-value">${s.val}</span>
                    <span class="stat-label">${s.label}</span>
                </div>
            `).join('');

            let glyph = '', bgClass = '';
        
            if (isGoldenHour) { 
                bgClass = 'sunset'; 
                glyph = '<i class="fas fa-cloud-sun"></i>'; 
            } else if (isNight) {
                if (raw.includes('storm')) { bgClass = 'night-storm'; glyph = '<i class="fas fa-bolt" style="color:#fbbf24"></i>'; }
                else if (raw.includes('rain')) { bgClass = 'night-rain'; glyph = '<i class="fas fa-cloud-moon-rain" style="color:#fbbf24"></i>'; }
                else if (raw.includes('snow')) { bgClass = 'night-snow'; glyph = '<i class="fas fa-snowflake"></i>'; }
                else { bgClass = 'night'; glyph = '<i class="fas fa-moon" style="color:#fbbf24"></i>'; }
            } else {
                if (raw.includes('storm')) { 
                    glyph = '<i class="fas fa-poo-storm"></i>'; bgClass = 'day-rainy'; 
                } else if (raw.includes('snow')) { 
                    glyph = '<i class="fas fa-snowflake"></i>'; bgClass = 'day-snowy'; 
                } else if (raw.includes('rain') || raw.includes('drizzle')) { 
                    glyph = '<i class="fas fa-cloud-showers-heavy"></i>'; bgClass = 'day-rainy'; 
                } else if (raw.includes('haze') || raw.includes('smoke')) { 
                    glyph = '<i class="fas fa-smog"></i>'; bgClass = 'day-haze'; 
                } else if (raw.includes('mist') || raw.includes('fog')) { 
                    glyph = '<i class="fas fa-smog"></i>'; bgClass = 'day-mist'; 
                } else if (raw.includes('cloud')) { 
                    glyph = '<i class="fas fa-cloud-sun"></i>'; bgClass = 'day-cloudy'; 
                } else { 
                    glyph = '<i class="fas fa-sun" style="color:#fbbf24"></i>'; bgClass = 'day-clear'; 
                }
            }

            document.documentElement.className = bgClass;
            localStorage.setItem('sn_last_theme', bgClass);

            const themeColors = {
                'day-clear': '#e67e22', 'day-cloudy': '#94a3b8', 'day-haze': '#a8a29e', 'day-mist': '#94a3b8', 'day-rainy': '#64748b',
                'day-snowy': '#f8fafc', 'sunset': '#4B0082', 'night': '#1e293b', 'night-rain': '#2c3e50',
                'night-snow': '#4a69bd', 'night-storm': '#1a1a2e'
            };
            
            const metaTheme = document.getElementById('status-bar-color');
            if (metaTheme) metaTheme.setAttribute('content', themeColors[bgClass] || '#1e293b');
            document.getElementById('glyph').innerHTML = glyph;
        }

        window.onload = () => { updateClock(); setInterval(updateClock, 1000); initApp(); };
        function initApp() {
            const lastTheme = localStorage.getItem('sn_last_theme');
            if (lastTheme) document.documentElement.className = lastTheme;
            const sLat = localStorage.getItem('sn_lat'), sLon = localStorage.getItem('sn_lon');
            if (sLat && sLon) weatherBallon(sLat, sLon); else getPreciseLocation();
        }
    </script>
</body>
</html>
